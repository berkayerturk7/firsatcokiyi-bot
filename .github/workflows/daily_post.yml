name: Günlük Instagram Post

# Asıl tetikleyici: cron-job.org, Türkiye saati 10:00 ve 14:00'te bu workflow'u
# API ile çalıştırır (inputs.slot = "10" / "14"). GitHub'ın kendi zamanlaması yoğun
# saatlerde saatlerce gecikebildiği için aşağıdaki schedule yalnızca YEDEK:
# slot o gün zaten yapıldıysa ya da tetikleme 6 saatten fazla geciktiyse
# main.py hiçbir şey paylaşmadan çıkar.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot: 10, 14, manual (slot kontrolü olmadan) veya auto (saate göre)"
        required: false
        default: "auto"
  schedule:
    # Yedek: 10:17 ve 14:17 TR (saat başı yoğunluğundan kaçınmak için :17)
    - cron: "17 7 * * *"
    - cron: "17 11 * * *"

permissions:
  contents: write  # görselleri, posted.json, runs.json ve docs/ commit'lemek için

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Git kimliği
        run: |
          git config user.name "firsatcokiyi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Amazon paylaşımları
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
          PYTHONUNBUFFERED: "1"
        run: python main.py
