name: Günlük Instagram Post

# Türkiye saatiyle 08:00-23:00 arasında saatte bir çalışır. main.py günün kalan
# paylaşımlarını (günde en fazla 50) kalan saatlere böler; GitHub'ın zamanlaması
# gecikse ya da bir çalıştırmayı atlasa da sonraki çalıştırmalar açığı kapatır.
# Her çalıştırmanın özeti günlük bir issue'ya yorum olarak yazılır (e-posta bildirimi).

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç post atılsın? Boş bırakılırsa otomatik"
        required: false
        default: ""
  schedule:
    - cron: "23 5-19 * * *"  # 08:23 ... 22:23 TR

permissions:
  contents: write  # görselleri, posted.json ve docs/ commit'lemek için
  issues: write    # paylaşım raporu (e-posta bildirimi)

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Git kimliği
        run: |
          git config user.name "firsatcokiyi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Amazon paylaşımları
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ inputs.count }}
          PYTHONUNBUFFERED: "1"
        run: python main.py
