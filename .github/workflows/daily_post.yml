name: Günlük Instagram Post

on:
  schedule:
    # Her gün 06:30 UTC = 09:30 Türkiye saati — GitHub gecikmesi (~60-90 dk) ile 10:30-11:00'a denk gelir
    - cron: "30 6 * * *"
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Sistem fontlarını kur
        run: |
          sudo apt-get install -y fonts-liberation fonts-dejavu-core fonts-noto-core
          fc-cache -f -v

      - name: Output klasörü oluştur
        run: mkdir -p output assets/photos assets/fonts

      - name: Inter fontlarını indir
        run: |
          curl -sL "https://github.com/rsms/inter/releases/download/v4.0/Inter-Regular.ttf" -o assets/fonts/Inter-Regular.ttf 2>/dev/null || true
          curl -sL "https://github.com/rsms/inter/releases/download/v4.0/Inter-Bold.ttf" -o assets/fonts/Inter-Bold.ttf 2>/dev/null || true
          ls -la assets/fonts/ || true

      - name: Günlük post at
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py --now
