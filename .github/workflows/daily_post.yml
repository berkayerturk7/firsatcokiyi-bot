name: Günlük Instagram Post

on:
  schedule:
    # 07:00 UTC = 10:00 Türkiye saati (GitHub zamanlaması gecikebilir)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write  # görselleri ve posted.json'u repoya commit'lemek için

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Git kimliği
        run: |
          git config user.name "firsatcokiyi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Günlük Amazon paylaşımları
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python main.py
